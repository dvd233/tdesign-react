name: Source-bound Table browser regression

on:
  push:
    branches: [validation/table-page-selection]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: table-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bound-browser:
    if: >-
      github.repository == 'dvd233/tdesign-react' &&
      github.repository_id == '1407033111' &&
      github.repository_owner_id == '111864431' &&
      github.ref == 'refs/heads/validation/table-page-selection' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: 'true'
      HUSKY: '0'
      GIT_TERMINAL_PROMPT: '0'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/playwright-browsers
    steps:
      - name: Check out independent validation branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.3'

      - name: Set up repository-pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '10.33.0'
          run_install: false

      - name: Check frozen manifest before executing source
        run: |
          set -euo pipefail
          node scripts/verify-execution-scope.mjs
          test "$(pnpm --version)" = '10.33.0'
          test "$(node --version)" = 'v22.23.3'
          mkdir -p evidence/baseline evidence/fixed work
          cp source-manifest.json evidence/source-manifest.json
          cp actions-lock.json evidence/actions-lock.json
          cp package-lock.json evidence/harness-package-lock.json
          cp locks/pnpm-lock.yaml evidence/source-pnpm-lock.yaml
          git rev-parse HEAD > evidence/validation-commit.txt

      - name: Install locked harness and check classifier
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee evidence/harness-install.log
          npm run check 2>&1 | tee evidence/harness-check.log
          node node_modules/playwright-core/cli.js install --with-deps chromium 2>&1 | tee evidence/chromium-install.log

      - name: Fetch exact public source commits and gitlink-pinned submodules
        run: |
          set -euo pipefail
          BASE_SHA=$(node -p 'require("./source-manifest.json").baselineSha')
          FIXED_SHA=$(node -p 'require("./source-manifest.json").candidate.sha')
          FIXED_REPO=$(node -p 'require("./source-manifest.json").candidate.repository')
          git clone --filter=blob:none --no-checkout https://github.com/Tencent/tdesign-react.git work/baseline
          git -C work/baseline checkout --detach "$BASE_SHA"
          git clone --filter=blob:none --no-checkout "https://github.com/$FIXED_REPO.git" work/fixed
          git -C work/fixed checkout --detach "$FIXED_SHA"
          for variant in baseline fixed; do
            git -C "work/$variant" submodule update --init --recursive
            cp locks/pnpm-lock.yaml "work/$variant/pnpm-lock.yaml"
            node scripts/verify-source.mjs --source "work/$variant" --variant "$variant" --out "evidence/$variant/source-before.json"
          done

      - name: Build both libraries from their exact source and bundle the same harness
        run: |
          set -euo pipefail
          for variant in baseline fixed; do
            pnpm -C "work/$variant" install --frozen-lockfile --ignore-scripts 2>&1 | tee "evidence/$variant/source-install.log"
            node scripts/verify-source.mjs --source "work/$variant" --variant "$variant" --compare "evidence/$variant/source-before.json" --out "evidence/$variant/source-after-install.json"
            pnpm -C "work/$variant" run build 2>&1 | tee "evidence/$variant/source-build.log"
            node scripts/verify-source.mjs --source "work/$variant" --variant "$variant" --compare "evidence/$variant/source-before.json" --out "evidence/$variant/source-after-build.json"
            node scripts/build-harness.mjs --source "work/$variant" --out "work/dist-$variant" --provenance "evidence/$variant/source-before.json" 2>&1 | tee "evidence/$variant/harness-build.log"
            cp "work/dist-$variant/build-provenance.json" "evidence/$variant/"
            cp "work/dist-$variant/esbuild-metafile.json" "evidence/$variant/"
          done

      - name: Execute identical real Chromium and Table scenarios
        run: |
          set -euo pipefail
          for variant in baseline fixed; do
            set +e
            node scripts/browser-regression.mjs --variant "$variant" --dist "work/dist-$variant" --out "evidence/$variant" 2>&1 | tee "evidence/$variant/browser-run.log"
            runner_status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$runner_status" > "evidence/$variant/process-exit-code.txt"
            test -s "evidence/$variant/results.json"
            REPORT_EXIT=$(node -p "require('./evidence/$variant/results.json').exitCode")
            test "$runner_status" = "$REPORT_EXIT"
          done

      - name: Verify exact expected baseline red, fixed green and unchanged source
        run: |
          set -euo pipefail
          for variant in baseline fixed; do
            node scripts/verify-source.mjs --source "work/$variant" --variant "$variant" --compare "evidence/$variant/source-before.json" --out "evidence/$variant/source-after-browser.json"
          done
          node scripts/verify-pair.mjs --baseline evidence/baseline/results.json --fixed evidence/fixed/results.json --out evidence/VERDICT.json 2>&1 | tee evidence/verdict.log

      - name: Upload results, actual screenshots, traces and provenance even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: table-page-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            work/dist-baseline/
            work/dist-fixed/
          if-no-files-found: error
          retention-days: 14
